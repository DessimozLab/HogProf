[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "HogProf"
version = "0.1.0"
authors = [
  { name = "Dave Moi", email = "dmoi@unil.ch" },
  { name = "Athina Gavriilidou", email = "athina.gavriilidou@unil.ch" },
  { name = "Nikolai Romashchenko", email = "nikolai.romashchenko@unil.ch" },
]
maintainers = [
  { name = "Nikolai Romashchenko", email = "nikolai.romashchenko@unil.ch" },
]
dependencies = [
  "biopython",
  "datasketch",
  "ete3",
  "goatools",
  "h5py",
  "legacy-cgi; python_version >= '3.13'", # ete3 imports the removed cgi package
  "lxml",
  "numpy",
  "pandas",
  "pyham>=1.1.10",
  "pyoma>=0.14.2",
  "rich",
  "tables",
]
description = "Phylogenetic Profiling with OMA and minhashing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
ml = ["keras"]

[project.urls]
"Homepage" = "https://github.com/DessimozLab/HogProf"
"Bug Tracker" = "https://github.com/DessimozLab/HogProf/issues"
"Docs" = "https://dessimozlab.github.io/HogProf/"

[project.scripts]
lshbuilder = "HogProf.lshbuilder:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
