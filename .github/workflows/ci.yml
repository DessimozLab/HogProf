name: hogprof-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lshbuilder:
    name: lshbuilder (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install HogProf
        run: python -m pip install .
      
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test OrthoXML builds
        run: python -m unittest discover -s tests -p 'lshbuilder_ci.py' -v
